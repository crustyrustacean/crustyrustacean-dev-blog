[package]
name = "crustyrustacean-dev-blog"
version = "1.3.2"
edition = "2024"
authors = ["Jeffery D. Mitchell", "<crusty.rustacean@gmail.com>"]
description = "A developer blog application built with Axum, Tera, and Turso database, hosted on Shuttle."
readme = "README.md"
repository = "https://github.com/crustyrustacean/crustyrustacean-dev-blog.git"
license = "MIT"
publish = false

[[bin]]
name = "crustyrustacean-dev-blog"
path = "src/bin/main.rs"

[lib]
name = "crustyrustacean_dev_blog_lib"
path = "src/lib/lib.rs"

[dependencies]
anyhow = "1.0.99"
argon2 = "0.5.3"
async-trait = "0.1.87"
axum = "0.8.6"
axum-extra = { version = "0.10.3", features = ["typed-header"] }
axum-macros = "0.5.0"
axum-template = { version = "3.0.0", features = [ "tera" ] }
chrono = { version = "0.4.42", features = ["serde"] }
jsonwebtoken = { version = "10.1.0", features = ["use_pem", "rust_crypto"] }
libsql = { version = "0.9.24", features = ["serde"] }
pulldown-cmark = "0.13.0"
rand = "0.9.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"
shuttle-axum = "0.57.0"
shuttle-runtime = { version = "0.57.0", default-features = false }
shuttle-turso = "0.57.0"
slug = "0.1.6"
tera = "1.20.0"
thiserror = "2.0.17"
tokio = "1.47.1"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["fs", "request-id", "trace", "util", "cors", "set-header"] }
tracing = { version = "0.1.41", features = ["log"] }
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.19", features = ["registry", "env-filter"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }

[dev-dependencies]
reqwest = { version = "0.12.12", features = [ "json" ] }
serde_json = "1.0.145"
