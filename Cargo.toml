[package]
name = "crustyrustacean-dev-blog"
version = "4.0.0"
edition = "2024"
authors = ["Jeffery D. Mitchell", "<crusty.rustacean@gmail.com>"]
description = "A developer blog application built with Actix Web, Tera, and PostgreSQL database."
readme = "README.md"
repository = "https://github.com/crustyrustacean/crustyrustacean-dev-blog.git"
license = "MIT"
publish = false

[[bin]]
name = "crustyrustacean-dev-blog"
path = "src/bin/main.rs"

[lib]
name = "crustyrustacean_dev_blog_lib"
path = "src/lib/lib.rs"

[dependencies]
actix-web = "4.13.0"
actix-files = "0.6.6"
actix-multipart = "0.7.2"
anyhow = "1.0.102"
argon2 = "0.5.3"
async-trait = "0.1.87"
chrono = { version = "0.4.44", features = ["serde"] }
config = { version = "0.15.19", default-features = false, features = ["yaml"] }
futures-util = "0.3.32"
jsonwebtoken = { version = "10.3.0", features = ["use_pem", "rust_crypto"] }
once_cell = "1.21.3"
opendal = { version = "0.55.0", features = ["services-s3", "services-fs"] }
pulldown-cmark = "0.13.1"
rand = "0.10.0"
regex = "1.12.3"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde-aux = "4.7.0"
serde_json = "1.0.149"
slug = "0.1.6"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
] }
tera = "1.20.1"
thiserror = "2.0.18"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread"] }
toml = "0.9.5"
tracing = { version = "0.1.44", features = ["log"] }
tracing-actix-web = "0.7.21"
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.19", features = ["registry", "env-filter"] }
uuid = { version = "1.22.0", features = ["v4", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
reqwest = { version = "0.13.2", features = ["multipart", "json"] }
serde_json = "1.0.145"
tempfile = "3.26"
