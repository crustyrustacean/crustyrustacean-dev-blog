[package]
name = "crustyrustacean-dev-blog"
version = "2.13.4"
edition = "2024"
authors = ["Jeffery D. Mitchell", "<crusty.rustacean@gmail.com>"]
description = "A developer blog application built with Axum, Tera, and Turso database, hosted on Shuttle."
readme = "README.md"
repository = "https://github.com/crustyrustacean/crustyrustacean-dev-blog.git"
license = "MIT"
publish = false

[[bin]]
name = "crustyrustacean-dev-blog"
path = "src/bin/main.rs"

[lib]
name = "crustyrustacean_dev_blog_lib"
path = "src/lib/lib.rs"

[dependencies]
anyhow = "1.0.99"
argon2 = "0.5.3"
async-trait = "0.1.87"
axum = { version = "0.8.7", features = [ "multipart" ] }
axum-extra = { version = "0.12.2", features = ["typed-header"] }
axum-macros = "0.5.0"
chrono = { version = "0.4.42", features = ["serde"] }
dotenvy = "0.15.7"
futures-util = "0.3.31"
jsonwebtoken = { version = "10.2.0", features = ["use_pem", "rust_crypto"] }
libsql = { version = "0.9.27", features = ["serde"] }
once_cell = "1.21.3"
opendal = { version = "0.54.1", features = [ "services-s3", "services-fs"] }
pulldown-cmark = "0.13.0"
rand = "0.9.2"
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"
shuttle-axum = "0.57.0"
shuttle-opendal = "0.57.0"
shuttle-runtime = { version = "0.57.0", default-features = false }
shuttle-turso = "0.57.0"
slug = "0.1.6"
tera = "1.20.1"
thiserror = "2.0.17"
tokio = "1.47.1"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["compression-gzip", "fs", "request-id", "trace", "util", "cors", "set-header"] }
tracing = { version = "0.1.41", features = ["log"] }
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.19", features = ["registry", "env-filter"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
httpmock = "0.8"
reqwest = { version = "0.12.12", features = [ "multipart", "json" ] }
serde_json = "1.0.145"
shuttle-common = "0.57.0"
tempfile = "3.8"
toml = "0.9.5"
