{% extends "base.html" %}

{% block title %}Reset Password - CrustyRustacean Dev Blog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-key fa-3x text-primary mb-3"></i>
                    <h2 class="card-title">Reset Password</h2>
                    <p class="text-muted">Enter your email to receive password reset instructions</p>
                </div>

                <div id="successMessage" class="alert alert-success d-none" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span id="successText"></span>
                </div>

                <div id="errorMessage" class="alert alert-danger d-none" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <span id="errorText"></span>
                </div>

                <form id="passwordResetRequestForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-envelope"></i>
                            </span>
                            <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3" id="submitBtn">
                        <i class="fas fa-paper-plane me-2"></i>
                        Send Reset Link
                    </button>

                    <div class="text-center">
                        <a href="/login" class="text-decoration-none">
                            <i class="fas fa-arrow-left me-2"></i>
                            Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('passwordResetRequestForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const submitBtn = document.getElementById('submitBtn');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const email = document.getElementById('email').value;

    // Hide previous messages
    errorMessage.classList.add('d-none');
    successMessage.classList.add('d-none');

    // Disable button during request
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Sending...';

    try {
        const response = await fetch('/api/password-reset/request', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email }),
        });

        const data = await response.json();

        if (response.ok) {
            document.getElementById('successText').textContent = data.message;
            successMessage.classList.remove('d-none');
            document.getElementById('passwordResetRequestForm').reset();
        } else {
            document.getElementById('errorText').textContent = data.message || 'An error occurred. Please try again.';
            errorMessage.classList.remove('d-none');
        }
    } catch (error) {
        document.getElementById('errorText').textContent = 'Network error. Please check your connection and try again.';
        errorMessage.classList.remove('d-none');
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Send Reset Link';
    }
});
</script>
{% endblock %}
