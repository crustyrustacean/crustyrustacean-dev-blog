# Default Light Theme for CrustyRustacean Dev Blog
# This theme preserves the original look and feel

[theme]
id = "default"
name = "Crusty Light"
description = "The default light theme with warm orange accents"
version = "1.0.0"
author = "CrustyRustacean"

[theme.supports]
color_scheme = "light"
high_contrast = false

[theme.colors]
# Primary palette
primary = "#ff6b35"
primary-hover = "#e55a2b"
secondary = "#2c3e50"
accent = "#e74c3c"

# Backgrounds
bg-body = "#ffffff"
bg-surface = "#f8f9fa"
bg-elevated = "#ffffff"
bg-gradient-start = "#667eea"
bg-gradient-end = "#764ba2"

# Text
text-primary = "#000000"
text-secondary = "#2d3748"
text-muted = "#6c757d"
text-on-primary = "#ffffff"

# Semantic colors
success = "#28a745"
warning = "#ffc107"
danger = "#dc3545"
info = "#17a2b8"

# Borders and effects
border-color = "#dee2e6"
border-radius = "12px"
shadow = "0 2px 15px rgba(0, 0, 0, 0.1)"
shadow-hover = "0 5px 25px rgba(0, 0, 0, 0.15)"

[theme.fonts]
body = "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
heading = "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
monospace = "'Monaco', 'Menlo', 'Ubuntu Mono', monospace"

[theme.external]
stylesheets = [
    "https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
]

[theme.meta]
preview_colors = ["#ff6b35", "#2c3e50", "#667eea"]
