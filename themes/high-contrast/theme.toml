# High Contrast Theme for CrustyRustacean Dev Blog
# Maximum readability for accessibility needs

[theme]
id = "high-contrast"
name = "High Contrast"
description = "Maximum readability with strong color contrast for accessibility"
version = "1.0.0"
author = "CrustyRustacean"

[theme.supports]
color_scheme = "light"
high_contrast = true

[theme.colors]
# Primary palette - strong, distinguishable colors
primary = "#0066cc"
primary-hover = "#004499"
secondary = "#000000"
accent = "#cc0000"

# Backgrounds - pure white for maximum contrast
bg-body = "#ffffff"
bg-surface = "#ffffff"
bg-elevated = "#ffffff"
bg-gradient-start = "#0066cc"
bg-gradient-end = "#004499"

# Text - pure black on white
text-primary = "#000000"
text-secondary = "#000000"
text-muted = "#333333"
text-on-primary = "#ffffff"

# Semantic colors - strong, distinguishable
success = "#006600"
warning = "#996600"
danger = "#cc0000"
info = "#0066cc"

# Borders and effects - solid, visible
border-color = "#000000"
border-radius = "0px"
shadow = "none"
shadow-hover = "0 0 0 3px #000000"

[theme.fonts]
body = "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
heading = "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
monospace = "'Monaco', 'Menlo', 'Ubuntu Mono', monospace"

[theme.external]
stylesheets = [
    "https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
]

[theme.meta]
preview_colors = ["#0066cc", "#ffffff", "#000000"]
