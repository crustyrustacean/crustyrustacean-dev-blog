# Dark Theme for CrustyRustacean Dev Blog
# A comfortable dark theme for late-night coding sessions

[theme]
id = "dark"
name = "Crusty Dark"
description = "A dark theme optimized for low-light environments"
version = "1.0.0"
author = "CrustyRustacean"

[theme.supports]
color_scheme = "dark"
high_contrast = false

[theme.colors]
# Primary palette - slightly warmer for dark mode
primary = "#ff8f5a"
primary-hover = "#ffa070"
secondary = "#4a6785"
accent = "#ff6b6b"

# Backgrounds - GitHub-inspired dark colors
bg-body = "#0d1117"
bg-surface = "#161b22"
bg-elevated = "#21262d"
bg-gradient-start = "#1a1a2e"
bg-gradient-end = "#16213e"

# Text - high contrast for readability
text-primary = "#f0f6fc"
text-secondary = "#8b949e"
text-muted = "#6e7681"
text-on-primary = "#ffffff"

# Semantic colors - slightly adjusted for dark backgrounds
success = "#3fb950"
warning = "#d29922"
danger = "#f85149"
info = "#58a6ff"

# Borders and effects
border-color = "#30363d"
border-radius = "12px"
shadow = "0 2px 15px rgba(0, 0, 0, 0.3)"
shadow-hover = "0 5px 25px rgba(0, 0, 0, 0.4)"

[theme.fonts]
body = "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
heading = "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
monospace = "'Monaco', 'Menlo', 'Ubuntu Mono', monospace"

[theme.external]
stylesheets = [
    "https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
]

[theme.meta]
preview_colors = ["#ff8f5a", "#0d1117", "#1a1a2e"]
